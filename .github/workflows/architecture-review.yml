name: External AWS architecture-review Action test

on:
  pull_request:

permissions:
  contents: read

jobs:
  proposed-architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare committed blueprint with the real PR base SHA
        uses: B11-Health/aws-emulator-mcp@b14fb52e6c69b661e7d0a8dd2d2dd2aa38c851be # v0.4.0-beta.13
        with:
          manifest: .aws-emulator/architecture.json
          fail-on-risk: high
